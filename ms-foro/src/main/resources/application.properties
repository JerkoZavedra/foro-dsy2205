spring.application.name=ms-foro
server.port=8080

# Mismo esquema Oracle local que ms-usuarios (FORO_APP), tablas propias.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${DB_USER:FORO_APP}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.cl.duoc.foro=INFO

# ms-foro valida credenciales delegando en ms-usuarios (ver UsuariosRemotosProvider).
foro.usuarios.url=${FORO_USUARIOS_URL:http://localhost:8081}

# Laboratorio local: HTTP Basic sin TLS, no exponer en una red publica.
server.address=127.0.0.1
