spring.application.name=ms-usuarios
server.port=8081

# Oracle local (XE / XEPDB1). Ver README raiz para crear el esquema FORO_APP.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${DB_USER:FORO_APP}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean una sola vez con los scripts de /sql; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.cl.duoc.usuarios=INFO

# Contrasenas de las 3 cuentas de demostracion (nunca se guardan en el codigo).
foro.seed.admin=${FORO_ADMIN_PASS:}
foro.seed.usuario1=${FORO_USUARIO1_PASS:}
foro.seed.usuario2=${FORO_USUARIO2_PASS:}

# Laboratorio local: HTTP Basic sin TLS, no exponer en una red publica.
server.address=127.0.0.1
