spring.application.name=ms-usuarios
server.port=8081

# Oracle Database Free local (contenedor fs3-oracle, puerto 1522, servicio FREEPDB1).
# Ver README raiz (seccion 5) para el detalle de como se creo este contenedor y
# por que el servicio es FREEPDB1 y no XEPDB1 (eso era Oracle XE, no Oracle Free).
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}
spring.datasource.username=${DB_USER:FORO_APP}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean una sola vez con los scripts de /sql; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.level.cl.duoc.usuarios=INFO

# Contrasenas de las 3 cuentas de demostracion (nunca se guardan en el codigo).
foro.seed.admin=${FORO_ADMIN_PASS:}
foro.seed.usuario1=${FORO_USUARIO1_PASS:}
foro.seed.usuario2=${FORO_USUARIO2_PASS:}

# Laboratorio local: HTTP Basic sin TLS, no exponer en una red publica.
server.address=127.0.0.1
